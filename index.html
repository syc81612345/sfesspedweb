    function showToast(msg, icon = "✨") {
      const box = document.getElementById("toastBox");
      const iconEl = document.getElementById("toastIcon");
      const textEl = document.getElementById("toastText");
      if (!box || !textEl) return;
      if (iconEl) iconEl.textContent = icon;
      textEl.textContent = msg;
      box.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add("hidden"), 2600);
    }

    function copyToClipboard(text, label) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`已複製「${label}」`, "📋");
        }).catch(() => {
          showToast(`已準備內容：${label}`, "📋");
        });
      } else {
        showToast(`已準備內容：${label}`, "📋");
      }
    }

    function bindViewportEvents() {
      const vp = document.getElementById("mainViewport");
      if (!vp) return;

      vp.querySelectorAll(".hero-jump-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const targetTab = btn.getAttribute("data-goto-tab");
          const targetSub = btn.getAttribute("data-goto-subtab");
          if (targetTab) activeTab = targetTab;
          if (targetSub) activeAdvocacySubtab = targetSub;
          renderNavigation();
          renderMainViewport();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      vp.querySelectorAll(".btn-copy-link").forEach(btn => {
        btn.addEventListener("click", () => {
          copyToClipboard(btn.getAttribute("data-copy-url"), btn.getAttribute("data-copy-label"));
        });
      });

      vp.querySelectorAll(".crit-tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCriteriaId = btn.getAttribute("data-crit-id");
          renderMainViewport();
        });
      });

      vp.querySelectorAll(".acc-toggle-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-acc-key");
          if (key) {
            openAccordions[key] = !openAccordions[key];
            renderMainViewport();
          }
        });
      });

      const btnExpandAll = document.getElementById("btnExpandAllCrit");
      if (btnExpandAll) {
        btnExpandAll.addEventListener("click", () => {
          openAccordions["crit-legal"] = true;
          openAccordions["crit-points"] = true;
          openAccordions["crit-obs"] = true;
          openAccordions["crit-excl"] = true;
          renderMainViewport();
        });
      }
      const btnCollapseAll = document.getElementById("btnCollapseAllCrit");
      if (btnCollapseAll) {
        btnCollapseAll.addEventListener("click", () => {
          openAccordions["crit-legal"] = false;
          openAccordions["crit-points"] = false;
          openAccordions["crit-obs"] = false;
          openAccordions["crit-excl"] = false;
          renderMainViewport();
        });
      }

      vp.querySelectorAll(".adv-subtab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeAdvocacySubtab = btn.getAttribute("data-adv-subtab");
          renderMainViewport();
        });
      });

      vp.querySelectorAll(".pbs-filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activePbsFilter = btn.getAttribute("data-pbs-filter");
          renderMainViewport();
        });
      });

      vp.querySelectorAll(".links-filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeLinksFilter = btn.getAttribute("data-links-filter");
          renderMainViewport();
        });
      });
    }

    function renderMainViewport() {
      const vp = document.getElementById("mainViewport");
      if (!vp) return;
      if (activeTab === "home") {
        vp.innerHTML = renderHomeView();
      } else if (activeTab === "iep") {
        vp.innerHTML = renderIepView();
      } else if (activeTab === "referral") {
        vp.innerHTML = renderReferralView();
      } else if (activeTab === "advocacy") {
        vp.innerHTML = renderAdvocacyView();
      } else if (activeTab === "communication") {
        vp.innerHTML = renderCommunicationView();
      } else if (activeTab === "links") {
        vp.innerHTML = renderLinksView();
      }
      window.scrollTo({ top: 0, behavior: "smooth" });
      bindViewportEvents();
    }

    function populateCloudModal() {
      const body = document.getElementById("cloudModalBody");
      if (!body) return;
      const allItems = getAllSearchableItems();
      body.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
          ${allItems.map(item => `
            <div class="p-3.5 rounded-2xl bg-teal-50/50 border border-teal-100 flex items-center justify-between gap-3">
              <div class="min-w-0">
                <div class="text-[11px] font-bold text-teal-700">${item.category}</div>
                <div class="font-black text-slate-900 text-xs sm:text-sm truncate mt-0.5">${item.title}</div>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <a href="${item.url}" target="_blank" rel="noopener noreferrer"
                  class="px-3 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs">
                  開啟 ↗
                </a>
                <button type="button" data-copy-url="${item.url}" data-copy-label="${item.title}"
                  class="modal-copy-btn px-2.5 py-1.5 rounded-xl bg-white border border-teal-200 text-teal-800 text-xs font-bold">
                  複製
                </button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
      body.querySelectorAll(".modal-copy-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          copyToClipboard(btn.getAttribute("data-copy-url"), btn.getAttribute("data-copy-label"));
        });
      });
    }

    function handleSearch(query) {
      const sec = document.getElementById("searchResultsSection");
      const kwEl = document.getElementById("searchKeywordDisplay");
      const grid = document.getElementById("searchResultsGrid");
      const clearBtn = document.getElementById("clearSearchBtn");
      const q = (query || "").trim().toLowerCase();

      if (!q) {
        sec.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      clearBtn.classList.remove("hidden");
      sec.classList.remove("hidden");
      kwEl.textContent = `「${query}」`;

      const matches = getAllSearchableItems().filter(item =>
        item.title.toLowerCase().includes(q) ||
        item.category.toLowerCase().includes(q) ||
        item.desc.toLowerCase().includes(q)
      );

      if (matches.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-5 text-center text-slate-500 text-xs sm:text-sm">
            找不到符合「${query}」的項目，請試試搜尋「學習障礙」、「ABCR」或「王意中」。
          </div>
        `;
        return;
      }

      grid.innerHTML = matches.map(m => `
        <div class="p-4 rounded-2xl bg-white border border-amber-200 flex flex-col justify-between gap-3 shadow-2xs">
          <div>
            <span class="text-[11px] font-bold text-teal-700">${m.category}</span>
            <h4 class="font-black text-slate-900 text-sm mt-1">${m.title}</h4>
            <p class="text-xs text-slate-600 mt-1 line-clamp-2">${m.desc}</p>
          </div>
          <div class="flex items-center gap-2 pt-2 border-t border-slate-100">
            <a href="${m.url}" target="_blank" rel="noopener noreferrer"
              class="flex-1 text-center py-1.5 px-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-xs">
              開啟連結 ↗
            </a>
            <button type="button" data-search-tab="${m.tab}" data-search-subtab="${m.subtab || ''}"
              class="search-jump-btn py-1.5 px-3 rounded-xl bg-teal-50 hover:bg-teal-100 border border-teal-200 text-teal-900 font-bold text-xs">
              前往分頁
            </button>
          </div>
        </div>
      `).join("");

      grid.querySelectorAll(".search-jump-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeTab = btn.getAttribute("data-search-tab");
          const sub = btn.getAttribute("data-search-subtab");
          if (sub) activeAdvocacySubtab = sub;
          renderNavigation();
          renderMainViewport();
          sec.classList.add("hidden");
        });
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderNavigation();
      renderMainViewport();
      populateCloudModal();

      document.getElementById("brandHomeTrigger").addEventListener("click", () => {
        activeTab = "home";
        renderNavigation();
        renderMainViewport();
      });

      const searchInput = document.getElementById("globalSearchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      const closeSearchBtn = document.getElementById("closeSearchBtn");

      searchInput.addEventListener("input", e => handleSearch(e.target.value));
      clearBtn.addEventListener("click", () => {
        searchInput.value = "";
        handleSearch("");
      });
      closeSearchBtn.addEventListener("click", () => {
        searchInput.value = "";
        handleSearch("");
      });

      const cloudModal = document.getElementById("cloudModal");
      document.getElementById("btnCloudDirectory").addEventListener("click", () => {
        cloudModal.classList.remove("hidden");
      });
      document.getElementById("btnCloseCloudModal").addEventListener("click", () => {
        cloudModal.classList.add("hidden");
      });
      cloudModal.addEventListener("click", e => {
        if (e.target === cloudModal) cloudModal.classList.add("hidden");
      });

      const btnFont = document.getElementById("btnFontScale");
      const fontLabel = document.getElementById("fontScaleLabel");
      const scales = ["1", "1.12", "1.22"];
      const scaleNames = ["字級：標準", "字級：加大", "字級：特大"];
      btnFont.addEventListener("click", () => {
        fontScaleIdx = (fontScaleIdx + 1) % scales.length;
        document.documentElement.style.setProperty("--font-scale", scales[fontScaleIdx]);
        fontLabel.textContent = scaleNames[fontScaleIdx];
        showToast(`已切換為「${scaleNames[fontScaleIdx]}」`, "🔍");
      });
    });
  </script>
</body>
</html>
